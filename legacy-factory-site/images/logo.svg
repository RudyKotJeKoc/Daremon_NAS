<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Background wave -->
  <path d="M0 60 Q100 20, 200 60 T400 60" stroke="url(#gradient1)" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M0 65 Q100 25, 200 65 T400 65" stroke="url(#gradient2)" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Radio wave icon -->
  <g transform="translate(20, 30)">
    <!-- Center dot -->
    <circle cx="30" cy="30" r="6" fill="#00C8B4"/>
    <!-- Wave rings -->
    <circle cx="30" cy="30" r="15" stroke="#00C8B4" stroke-width="2.5" fill="none" opacity="0.8"/>
    <circle cx="30" cy="30" r="24" stroke="#FF6B35" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="30" cy="30" r="33" stroke="#FFD23F" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>

  <!-- RADIO text -->
  <text x="100" y="55" font-family="Orbitron, sans-serif" font-size="42" font-weight="900" fill="url(#textGradient)" letter-spacing="2">
    RADIO
  </text>

  <!-- ETS text -->
  <text x="100" y="90" font-family="Orbitron, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" opacity="0.9" letter-spacing="8">
    ETS
  </text>

  <!-- Frequency display -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="65" height="28" rx="14" fill="rgba(0, 200, 180, 0.2)" stroke="#00C8B4" stroke-width="1.5"/>
    <text x="32.5" y="19" font-family="Orbitron, sans-serif" font-size="12" font-weight="700" fill="#00C8B4" text-anchor="middle">
      24/7
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C8B4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD23F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C8B4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C8B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
