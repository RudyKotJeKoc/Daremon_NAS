<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bgGrad)"/>

  <!-- Radio Icon -->
  <circle cx="600" cy="450" r="150" fill="none" stroke="#008878" stroke-width="8"/>
  <circle cx="600" cy="450" r="120" fill="none" stroke="#008878" stroke-width="4"/>
  <rect x="540" y="340" width="120" height="30" rx="15" fill="#008878"/>

  <!-- Text -->
  <text x="600" y="700" font-family="Orbitron, Arial, sans-serif" font-size="72" font-weight="bold" fill="#008878" text-anchor="middle">RADIO ETS</text>
  <text x="600" y="780" font-family="Arial, sans-serif" font-size="36" fill="#FFFFFF" text-anchor="middle">Bedrijfsradio</text>
</svg>
